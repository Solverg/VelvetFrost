<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бульдозер — анимация</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e8edef; color: #27363d; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(92vw, 640px); }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 0.35rem; }
    p { margin: 0 0 1rem; color: #52636b; }
    .stage { overflow: hidden; border: 1px solid #c3ced1; border-radius: 12px; background: #d5e0e4; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    button { margin-top: 1rem; padding: .55rem 1rem; border: 1px solid #82959d; border-radius: 6px; color: inherit; background: #f8faf9; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #306d88; outline-offset: 3px; }
    .note { margin-top: 1rem; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Бульдозер готовится к работе</h1>
    <p>Небольшой набросок будущего снегоуборщика.</p>
    <div class="stage"><canvas id="bulldozer" width="480" height="360" role="img" aria-label="Пиксельный бульдозер: двигатель дрожит, из трубы идёт дым, маячок мигает, гусеницы движутся, а отвал поднимается и опускается."></canvas></div>
    <button id="pause" type="button">Пауза</button>
    <p class="note" id="status" role="status">Загрузка изображения…</p>
  </main>
  <script src="bulldozer-animation.js"></script>
</body>
</html>
